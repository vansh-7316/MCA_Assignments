<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="container">

    <header>
        <h1>Employee Management System</h1>
        <p>Manage your employees in one place</p>
    </header>

    <!-- Employee Form -->
    <section class="form-section">
        <h2 id="formTitle">Add New Employee</h2>

        <form id="employeeForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="empId">Employee ID</label>
                    <input type="text" id="empId"
                           placeholder="Enter employee ID" required>
                </div>

                <div class="form-group">
                    <label for="empName">Full Name</label>
                    <input type="text" id="empName"
                           placeholder="Enter employee name" required>
                </div>

                <div class="form-group">
                    <label for="empEmail">Email</label>
                    <input type="email" id="empEmail"
                           placeholder="Enter email address" required>
                </div>

                <div class="form-group">
                    <label for="empDepartment">Department</label>
                    <select id="empDepartment" required>
                        <option value="">Select Department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="empSalary">Salary (₹)</label>
                    <input type="number" id="empSalary"
                           placeholder="Enter salary"
                           min="0.01" step="0.01" required>
                </div>

            </div>

            <div class="form-buttons">
                <button type="submit" id="submitBtn" class="btn primary">
                    Add Employee
                </button>

                <button type="button" id="cancelBtn"
                        class="btn secondary" hidden>
                    Cancel Edit
                </button>
            </div>

        </form>
    </section>

    <!-- Employee List -->
    <section class="list-section">

        <h2>Employee Records</h2>

        <div class="controls">

            <input type="text" id="searchInput"
                   placeholder="Search by name or employee ID">

            <select id="departmentFilter">
                <option value="">All Departments</option>
                <option value="IT">IT</option>
                <option value="HR">HR</option>
                <option value="Finance">Finance</option>
                <option value="Marketing">Marketing</option>
                <option value="Sales">Sales</option>
            </select>

        </div>

        <div class="table-container">
            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="employeeTableBody">
                    <!-- JavaScript displays employees here -->
                </tbody>

            </table>
        </div>

        <p id="employeeCount">Total Employees: 0</p>

    </section>

</div>

<script src="script.js"></script>


</body>
</html>
